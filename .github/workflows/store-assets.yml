name: Submit production release and listing

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Signed, tested internal version to submit to production'
        required: true
        default: '30'
        type: string

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    environment: Playstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit verified copy and screenshots
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3'
          python scripts/update_store_listing.py --apply --production-version "$RELEASE_VERSION_CODE"
